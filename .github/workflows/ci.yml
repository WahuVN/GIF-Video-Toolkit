name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Preset smoke test
        run: python gif_tool.py --list-presets
      - name: Compile check
        run: python -m compileall -q gif_tool.py gif_gui.py video_cutter
